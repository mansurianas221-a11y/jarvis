name: Build Jarvis APK

# Cloud build -> standalone installable RELEASE apk (JS bundle embedded).
# Run: repo -> Actions -> "Build Jarvis APK" -> Run workflow
# Output: run page -> Artifacts -> jarvis-apk (zip) -> jarvis-<n>.apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned on purpose: "ubuntu-latest" is being migrated to 26.04 (Oct-Nov 2026)
    # and that migration has broken several Android tooling actions.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: we deliberately do NOT use android-actions/setup-android.
      # That action installs the "tools" package, which Google stopped
      # serving in Sep 2026 -> "Failed to find package 'tools'" -> exit 1.
      # The GitHub runner already ships the Android SDK; we only add the
      # NDK version that React Native 0.76 expects.
      - name: Android SDK packages (NDK 26.1.10909125)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          echo "SDK root: $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK" >&2
            ls -la "$SDK" || true
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "--- installed ---"
          ls "$SDK/ndk" || true
          ls "$SDK/build-tools" || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Toolchain info
        continue-on-error: true
        run: |
          node -v
          npm -v
          npx expo --version
          npx expo-doctor || true

      - name: Prebuild android project
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild -p android --no-install

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/jarvis-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30