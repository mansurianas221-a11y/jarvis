name: Build Jarvis APK

# Cloud build -> standalone installable RELEASE apk (JS bundle embedded).
# Run: repo -> Actions -> "Build Jarvis APK" -> Run workflow
# Output: run page -> Artifacts -> jarvis-apk (zip) -> jarvis-<n>.apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Toolchain info
        continue-on-error: true
        run: |
          node -v
          npm -v
          npx expo --version
          npx expo-doctor || true

      - name: Prebuild android project
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/jarvis-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30